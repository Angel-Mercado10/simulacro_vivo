services:
  - type: web
    name: simulacro-vivo
    runtime: node
    plan: starter
    healthCheckPath: /api/health
    buildCommand: npm install -g pnpm@10 && pnpm install && pnpm -r build
    startCommand: pnpm --filter @simulacro/api exec tsx src/main.ts
    envVars:
      - key: NODE_VERSION
        value: "22.17.0"
      - key: MODEL_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: SESSION_BUDGET_USD
        value: "0.50"
      - key: DAILY_BUDGET_USD
        value: "5.00"
